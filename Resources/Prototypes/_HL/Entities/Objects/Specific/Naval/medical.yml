- type: entity
  name: first aid medipen
  parent: ChemicalMedipen
  id: FirstAidMedipen
  description: An improved emergency medipen, containing a mixture of chemicals that can stabilize a patient in a pinch whether alive or critical.
  components:
  - type: Item
    inhandVisuals:
      left:
      - state: base-needle-inhand-left
      - state: base-colorA-inhand-left
        color: "#FFFFFF"
      - state: base-colorB-inhand-left
      right:
      - state: base-needle-inhand-right
      - state: base-colorA-inhand-right
        color: "#FFFFFF"
      - state: base-colorB-inhand-right
  - type: Sprite
    sprite: Objects/Specific/Medical/medipen.rsi
    layers:
    - state: firstaid
      map: ["enum.SolutionContainerLayers.Fill"]
  - type: SolutionContainerVisuals
    maxFillLevels: 1
    changeColor: false
    emptySpriteName: firstaid_empty
  - type: SolutionContainerManager
    solutions:
      pen:
        maxVol: 30
        reagents:
        - ReagentId: Bicaridine
          Quantity: 10
        - ReagentId: Dermaline
          Quantity: 10
        - ReagentId: Epinephrine
          Quantity: 5
        - ReagentId: Saline
          Quantity: 5
  - type: ExaminableSolution
    solution: pen
  - type: Tag
    tags: []
