- type: entity
  name: naval combat aid kit
  description: It's a squad-level medical carry kit, with enough equipment to treat multiple infantrymen.
  parent: Medkit
  id: MedkitNaval
  components:
   - type: Sprite
     state: navalkit
   - type: Storage
     maxItemSize: Small
     grid:
     - 0,0,5,3
   - type: Item
     size: Normal
     heldPrefix: navalkit

- type: entity
  name: naval combat aid kit
  id: MedkitNavalFilled
  suffix: Filled
  parent: MedkitNaval
  components:
  - type: StorageFill
    contents:
      - id: MedicatedSuture
      - id: RegenerativeMesh
      - id: MedicatedSuture
      - id: RegenerativeMesh
      - id: Bloodpack
      - id: Bloodpack
      - id: VialCombatAntiradiation
      - id: VialCombatAntipoison
      - id: SyringeEthylredoxrazine
      - id: PillCanisterCharcoal
      - id: StellibininMedipen
      - id: StellibininMedipen
      - id: HemamaxizineMedipen
      - id: HemamaxizineMedipen

- type: entity
  id: VialCombatAntipoison
  parent: VialBluespace
  name: Bluespace Stellibinin Vial
  components:
  - type: Label
    currentLabel:
  - type: SolutionContainerManager
    solutions:
      beaker:
        maxVol: 100
        reagents:
          - ReagentId: Stellibinin
            Quantity: 100

- type: entity
  name: advanced poison auto-injector
  parent: ChemicalMedipen
  id: StellibininMedipen
  description: A rapid dose of Stellibinin to rid the body of poison. It just works. This one can be refilled.
  components:
  - type: Item
    inhandVisuals:
      left:
      - state: base-needle-inhand-left
      - state: base-colorA-inhand-left
        color: "#414265"
      - state: base-colorB-inhand-left
      right:
      - state: base-needle-inhand-right
      - state: base-colorA-inhand-right
        color: "#414265"
      - state: base-colorB-inhand-right
  - type: Sprite
    sprite: Objects/Specific/Medical/medipen.rsi
    layers:
    - state: stelpen
      map: ["enum.SolutionContainerLayers.Fill"]
  - type: SolutionContainerVisuals
    maxFillLevels: 1
    changeColor: false
    emptySpriteName: stelpen_empty
  - type: SolutionContainerManager
    solutions:
      pen:
        maxVol: 10
        reagents:
        - ReagentId: Stellibinin
          Quantity: 10
  - type: ExaminableSolution
    solution: pen
  - type: RefillableSolution
    solution: pen
  - type: Tag
    tags: []

